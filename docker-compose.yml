services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - log-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional PostgreSQL: start with `docker compose --profile postgres up` and set
  # DATABASE_URL=postgresql://signaldesk:signaldesk@postgres:5432/signaldesk in .env
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: signaldesk
      POSTGRES_PASSWORD: signaldesk
      POSTGRES_DB: signaldesk
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  log-data:
  pg-data:
